name: Publish Arch repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package and repository database
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                meson ninja pkgconf wlroots0.20 gtk4 foot fuzzel systemd \
                pacman-contrib
              useradd --create-home builder
              chown -R builder:builder /workspace
              runuser -u builder -- makepkg --cleanbuild --nodeps --noconfirm
              repo=/workspace/site/x86_64
              install -d "$repo"
              install -m644 /workspace/nixde-*.pkg.tar.zst "$repo/"
              repo-add "$repo/nixde.db.tar.gz" "$repo"/*.pkg.tar.zst
              rm -f "$repo/nixde.db" "$repo/nixde.files"
              cp "$repo/nixde.db.tar.gz" "$repo/nixde.db"
              cp "$repo/nixde.files.tar.gz" "$repo/nixde.files"
              printf "%s\n" "NixDE Arch package repository" \
                > /workspace/site/index.html
              touch /workspace/site/.nojekyll
            '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
